openapi: 3.1.0
info:
  title: cfb control plane
  version: 3.0.0
  description: |
    Thin credential-holding proxy between the SPA and the node agents. No call waits for a
    workload operation; every mutation is idempotent; errors carry `code` and `retryable`.
servers:
  - url: https://cfb.example/api/v1
security:
  - AccessJWT: []

paths:
  /nodes:
    get:
      summary: List nodes with health
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, ready, stale, draining, revoked] } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Node" } }

  /nodes/enroll:
    post:
      summary: Mint a one-time enrolment token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capabilities]
              properties:
                name: { type: string }
                labels: { type: object, additionalProperties: { type: string } }
                capabilities:
                  type: array
                  items: { type: string, enum: [exec, container, vm, workerd, port.forward, fs, metrics, storage.proxy] }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  token: { type: string, description: single use, 15 minutes }
                  expires_at: { type: string, format: date-time }

  /nodes/{id}/drain:
    post:
      summary: Stop accepting new workloads, let running ones finish
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Draining }

  /nodes/{id}/revoke:
    post:
      summary: Revoke the node credential
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }

  /workloads:
    get:
      summary: List workloads
      parameters:
        - { name: node_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Workload" } }

  /workloads/{id}:
    put:
      summary: Upsert a workload spec; bumps generation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadSpec" }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
    delete:
      summary: Stop and remove
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Stopping }

  /jobs:
    post:
      summary: Submit a one-shot job
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkloadSpec"
                - type: object
                  properties:
                    node_id: { type: string, description: omit to let the control plane place it }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }

  /jobs/{id}/logs:
    get:
      summary: Live log stream (SSE), cursor-based
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            text/event-stream:
              schema: { type: string }

  /jobs/{id}/cancel:
    post:
      summary: Cancel a running job
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202": { description: Cancelling }

  /storage/presign:
    post:
      summary: Presigned URL; bytes never transit the Worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, key, method]
              properties:
                bucket: { type: string, enum: [images, cache, artifacts, logs] }
                key: { type: string }
                method: { type: string, enum: [PUT, GET] }
                expires_s: { type: integer, default: 900 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }

  /audit:
    get:
      summary: Append-only audit log
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

components:
  securitySchemes:
    AccessJWT:
      type: http
      scheme: bearer
      description: Cloudflare Access JWT for operators; API token for CI.

  schemas:
    Node:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string, enum: [pending, ready, stale, draining, revoked] }
        capabilities: { type: array, items: { type: string } }
        labels: { type: object, additionalProperties: { type: string } }
        last_seen: { type: string, format: date-time }
        capacity:
          type: object
          properties:
            cpu_millis: { type: integer }
            memory_mib: { type: integer }
            disk_free_mib: { type: integer }

    WorkloadSpec:
      type: object
      required: [kind, image]
      properties:
        kind: { type: string, enum: [container, vm, workerd] }
        image: { type: string, description: "digest-pinned reference" }
        cpu_millis: { type: integer, default: 1000 }
        memory_mib: { type: integer, default: 1024 }
        timeout_s: { type: integer }
        restart: { type: string, enum: [never, on-failure, always], default: on-failure }
        mounts:
          type: array
          items:
            type: object
            properties:
              from: { type: string, description: "storage prefix" }
              to: { type: string, description: "absolute path in the workload" }
        env: { type: object, additionalProperties: { type: string } }

    Workload:
      type: object
      properties:
        id: { type: string }
        node_id: { type: string }
        generation: { type: integer }
        state: { type: string, enum: [pending, starting, running, succeeded, failed, stopped] }
        exit_code: { type: integer, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        spec: { $ref: "#/components/schemas/WorkloadSpec" }

    AuditEntry:
      type: object
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        outcome: { type: string, enum: [allowed, denied, error] }

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string, example: vpc_degraded }
        message: { type: string }
        retryable: { type: boolean }
